<svg xmlns="http://www.w3.org/2000/svg" width="280" height="188" viewBox="0 0 280 188" role="img">
<style>
text{font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;fill:#ECEEF1;font-variant-numeric:tabular-nums}
.lab{font-size:12px;fill:#8A909B}
.sub{font-size:13px;fill:#8A909B}
.serif{font-family:ui-serif, "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;font-weight:400;letter-spacing:-.015em}
.f{opacity:0;animation:rise 1s cubic-bezier(.2,.7,.2,1) forwards}
.g{transform-box:fill-box;transform-origin:left center;transform:scaleX(0);animation:grow 1.4s cubic-bezier(.2,.7,.2,1) forwards}
.d{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 2.8s cubic-bezier(.4,0,.2,1) .4s forwards}
.p{animation:breathe 3.6s ease-in-out infinite}
.s{opacity:0;animation:scan 11s linear 4s infinite}
@keyframes rise{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@keyframes grow{to{transform:scaleX(1)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes breathe{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes scan{0%{transform:translateX(0);opacity:0}6%{opacity:.55}94%{opacity:.55}100%{transform:translateX(795px);opacity:0}}
@media (prefers-reduced-motion:reduce){
  .f,.g,.d,.p{animation:none;opacity:1;transform:none;stroke-dashoffset:0}
  .s{display:none}
}</style>
<rect x=".5" y=".5" width="279" height="187" rx="8" fill="#0F1115" stroke="#23272E"/>
<text class="lab f" x="24" y="34" style="animation-delay:0.10s">Languages</text><g class="f" style="animation-delay:0.20s"><text x="24" y="66" font-size="13">Python</text><text class="lab" x="256" y="66" text-anchor="end">53.9%</text></g>
<rect x="24" y="73" width="232" height="1" fill="#23272E"/>
<rect class="g" x="24" y="72.5" width="232.0" height="2" fill="#8CA2FF" fill-opacity="1" style="animation-delay:0.40s"/>
<g class="f" style="animation-delay:0.30s"><text x="24" y="90" font-size="13">Kotlin</text><text class="lab" x="256" y="90" text-anchor="end">20.4%</text></g>
<rect x="24" y="97" width="232" height="1" fill="#23272E"/>
<rect class="g" x="24" y="96.5" width="87.7" height="2" fill="#ECEEF1" fill-opacity="0.48000000000000004" style="animation-delay:0.50s"/>
<g class="f" style="animation-delay:0.40s"><text x="24" y="114" font-size="13">TypeScript</text><text class="lab" x="256" y="114" text-anchor="end">12.7%</text></g>
<rect x="24" y="121" width="232" height="1" fill="#23272E"/>
<rect class="g" x="24" y="120.5" width="54.5" height="2" fill="#ECEEF1" fill-opacity="0.41000000000000003" style="animation-delay:0.60s"/>
<g class="f" style="animation-delay:0.50s"><text x="24" y="138" font-size="13">JavaScript</text><text class="lab" x="256" y="138" text-anchor="end">8.2%</text></g>
<rect x="24" y="145" width="232" height="1" fill="#23272E"/>
<rect class="g" x="24" y="144.5" width="35.3" height="2" fill="#ECEEF1" fill-opacity="0.34" style="animation-delay:0.70s"/>
<g class="f" style="animation-delay:0.60s"><text x="24" y="162" font-size="13">C++</text><text class="lab" x="256" y="162" text-anchor="end">3.3%</text></g>
<rect x="24" y="169" width="232" height="1" fill="#23272E"/>
<rect class="g" x="24" y="168.5" width="14.2" height="2" fill="#ECEEF1" fill-opacity="0.27" style="animation-delay:0.80s"/>
</svg>