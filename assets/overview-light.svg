<svg xmlns="http://www.w3.org/2000/svg" width="280" height="188" viewBox="0 0 280 188" role="img">
<style>
text{font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;fill:#14171C;font-variant-numeric:tabular-nums}
.lab{font-size:12px;fill:#6A707A}
.sub{font-size:13px;fill:#6A707A}
.serif{font-family:ui-serif, "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;font-weight:400;letter-spacing:-.015em}
.f{opacity:0;animation:rise 1s cubic-bezier(.2,.7,.2,1) forwards}
.g{transform-box:fill-box;transform-origin:left center;transform:scaleX(0);animation:grow 1.4s cubic-bezier(.2,.7,.2,1) forwards}
.d{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 2.8s cubic-bezier(.4,0,.2,1) .4s forwards}
.p{animation:breathe 3.6s ease-in-out infinite}
.s{opacity:0;animation:scan 11s linear 4s infinite}
@keyframes rise{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@keyframes grow{to{transform:scaleX(1)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes breathe{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes scan{0%{transform:translateX(0);opacity:0}6%{opacity:.55}94%{opacity:.55}100%{transform:translateX(795px);opacity:0}}
@media (prefers-reduced-motion:reduce){
  .f,.g,.d,.p{animation:none;opacity:1;transform:none;stroke-dashoffset:0}
  .s{display:none}
}</style>
<rect x=".5" y=".5" width="279" height="187" rx="8" fill="#FBFBFA" stroke="#E3E5E8"/>
<text class="lab f" x="24" y="34" style="animation-delay:0.10s">Overview</text><g class="f" style="animation-delay:0.20s"><text class="sub" x="24" y="72">Repositories</text><text class="serif" x="256" y="72" text-anchor="end" font-size="20">31</text><rect x="24" y="81" width="232" height="1" fill="#E3E5E8"/></g>
<g class="f" style="animation-delay:0.30s"><text class="sub" x="24" y="102">Stars</text><text class="serif" x="256" y="102" text-anchor="end" font-size="20">1</text><rect x="24" y="111" width="232" height="1" fill="#E3E5E8"/></g>
<g class="f" style="animation-delay:0.40s"><text class="sub" x="24" y="132">Forks</text><text class="serif" x="256" y="132" text-anchor="end" font-size="20">2</text><rect x="24" y="141" width="232" height="1" fill="#E3E5E8"/></g>
<g class="f" style="animation-delay:0.50s"><text class="sub" x="24" y="162">Followers</text><text class="serif" x="256" y="162" text-anchor="end" font-size="20">4</text><rect x="24" y="171" width="232" height="1" fill="#E3E5E8"/></g>
</svg>