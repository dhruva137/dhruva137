<svg xmlns="http://www.w3.org/2000/svg" width="880" height="136" viewBox="0 0 880 136" role="img">
<style>
text{font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;fill:#14171C;font-variant-numeric:tabular-nums}
.lab{font-size:12px;fill:#6A707A}
.sub{font-size:13px;fill:#6A707A}
.serif{font-family:ui-serif, "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;font-weight:400;letter-spacing:-.015em}
.f{opacity:0;animation:rise 1s cubic-bezier(.2,.7,.2,1) forwards}
.g{transform-box:fill-box;transform-origin:left center;transform:scaleX(0);animation:grow 1.4s cubic-bezier(.2,.7,.2,1) forwards}
.d{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 2.8s cubic-bezier(.4,0,.2,1) .4s forwards}
.p{animation:breathe 3.6s ease-in-out infinite}
.s{opacity:0;animation:scan 11s linear 4s infinite}
@keyframes rise{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@keyframes grow{to{transform:scaleX(1)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes breathe{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes scan{0%{transform:translateX(0);opacity:0}6%{opacity:.55}94%{opacity:.55}100%{transform:translateX(795px);opacity:0}}
@media (prefers-reduced-motion:reduce){
  .f,.g,.d,.p{animation:none;opacity:1;transform:none;stroke-dashoffset:0}
  .s{display:none}
}</style>
<rect x=".5" y=".5" width="879" height="135" rx="8" fill="#FBFBFA" stroke="#E3E5E8"/>

<text class="lab f" x="32" y="46" style="animation-delay:0.15s">Public repositories</text>
<text class="serif f" x="32" y="88" font-size="40" style="animation-delay:0.20s">30</text>
<text class="sub f" x="32" y="112" style="animation-delay:0.25s">7 active in the last 30 days</text>
<rect x="236" y="28" width="1" height="80" fill="#E3E5E8"/>
<text class="lab f" x="256" y="46" style="animation-delay:0.27s">Stars received</text>
<text class="serif f" x="256" y="88" font-size="40" style="animation-delay:0.32s">1</text>
<text class="sub f" x="256" y="112" style="animation-delay:0.37s">Most starred: shockmap</text>
<rect x="440" y="28" width="1" height="80" fill="#E3E5E8"/>
<text class="lab f" x="460" y="46" style="animation-delay:0.39s">Forks</text>
<text class="serif f" x="460" y="88" font-size="40" style="animation-delay:0.44s">2</text>
<text class="sub f" x="460" y="112" style="animation-delay:0.49s">4 followers</text>
<rect x="644" y="28" width="1" height="80" fill="#E3E5E8"/>
<text class="lab f" x="664" y="46" style="animation-delay:0.51s">Contributions, 12 months</text>
<text class="serif f" x="664" y="88" font-size="40" style="animation-delay:0.56s">485</text>
<text class="sub f" x="664" y="112" style="animation-delay:0.61s">9.3 per week on average</text>
</svg>