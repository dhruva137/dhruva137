<svg xmlns="http://www.w3.org/2000/svg" width="880" height="126" viewBox="0 0 880 126" role="img" aria-label="Talk is cheap. Show me the code. — Linus Torvalds">
<title>Talk is cheap. Show me the code. — Linus Torvalds</title>
<style>
.serif{font-family:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif}.sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,'Cascadia Mono',Consolas,Menlo,monospace}
.f{opacity:0;animation:rise 1.1s cubic-bezier(.2,.7,.2,1) forwards}
