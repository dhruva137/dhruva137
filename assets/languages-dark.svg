<svg xmlns="http://www.w3.org/2000/svg" width="880" height="168" viewBox="0 0 880 168" role="img">
<style>
text{font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;fill:#ECEEF1;font-variant-numeric:tabular-nums}
.lab{font-size:12px;fill:#8A909B}
.sub{font-size:13px;fill:#8A909B}
.serif{font-family:ui-serif, "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;font-weight:400;letter-spacing:-.015em}
.f{opacity:0;animation:rise 1s cubic-bezier(.2,.7,.2,1) forwards}
.g{transform-box:fill-box;transform-origin:left center;transform:scaleX(0);animation:grow 1.4s cubic-bezier(.2,.7,.2,1) forwards}
.d{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 2.8s cubic-bezier(.4,0,.2,1) .4s forwards}
.p{animation:breathe 3.6s ease-in-out infinite}
.s{opacity:0;animation:scan 11s linear 4s infinite}
@keyframes rise{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@keyframes grow{to{transform:scaleX(1)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes breathe{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes scan{0%{transform:translateX(0);opacity:0}6%{opacity:.55}94%{opacity:.55}100%{transform:translateX(795px);opacity:0}}
@media (prefers-reduced-motion:reduce){
  .f,.g,.d,.p{animation:none;opacity:1;transform:none;stroke-dashoffset:0}
  .s{display:none}
}</style>
<rect x=".5" y=".5" width="879" height="167" rx="8" fill="#0F1115" stroke="#23272E"/>
<text class="lab f" x="32" y="38" style="animation-delay:0.10s">Languages, by bytes across 25 recent repositories</text>
<rect class="g" x="32.0" y="64" width="634.8" height="8" rx="1.5" fill="#8CA2FF" fill-opacity="1" style="animation-delay:0.30s"/>
<rect class="g" x="669.8" y="64" width="150.1" height="8" rx="1.5" fill="#ECEEF1" fill-opacity="0.8" style="animation-delay:0.42s"/>
<rect class="g" x="823.0" y="64" width="19.8" height="8" rx="1.5" fill="#ECEEF1" fill-opacity="0.58" style="animation-delay:0.54s"/>
<rect class="g" x="845.7" y="64" width="2.0" height="8" rx="1.5" fill="#ECEEF1" fill-opacity="0.42" style="animation-delay:0.66s"/>
<rect class="g" x="846.9" y="64" width="2.0" height="8" rx="1.5" fill="#ECEEF1" fill-opacity="0.28" style="animation-delay:0.78s"/>
<g class="f" style="animation-delay:0.80s">
<circle cx="36" cy="108" r="4" fill="#8CA2FF" fill-opacity="1"/>
<text x="48" y="112" font-size="13">Python</text>
<text class="lab" x="212" y="112" text-anchor="end">78.2%</text></g>
<g class="f" style="animation-delay:0.87s">
<circle cx="240" cy="108" r="4" fill="#ECEEF1" fill-opacity="0.8"/>
<text x="252" y="112" font-size="13">TypeScript</text>
<text class="lab" x="416" y="112" text-anchor="end">18.8%</text></g>
<g class="f" style="animation-delay:0.94s">
<circle cx="444" cy="108" r="4" fill="#ECEEF1" fill-opacity="0.58"/>
<text x="456" y="112" font-size="13">JavaScript</text>
<text class="lab" x="620" y="112" text-anchor="end">2.8%</text></g>
<g class="f" style="animation-delay:1.01s">
<circle cx="648" cy="108" r="4" fill="#ECEEF1" fill-opacity="0.42"/>
<text x="660" y="112" font-size="13">Shell</text>
<text class="lab" x="824" y="112" text-anchor="end">0.1%</text></g>
<g class="f" style="animation-delay:1.08s">
<circle cx="36" cy="136" r="4" fill="#ECEEF1" fill-opacity="0.28"/>
<text x="48" y="140" font-size="13">PowerShell</text>
<text class="lab" x="212" y="140" text-anchor="end">0.1%</text></g>
</svg>