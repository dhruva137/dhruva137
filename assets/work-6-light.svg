<svg xmlns="http://www.w3.org/2000/svg" width="432" height="176" viewBox="0 0 432 176" role="img" aria-label="COAST">
<title>COAST</title>
<style>
.serif{font-family:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif}
.sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,'Cascadia Mono',Consolas,Menlo,monospace}
.f{opacity:0;animation:rise 1.1s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes rise{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}

@media (prefers-reduced-motion:reduce){.f,.d{animation:none;opacity:1;transform:none;stroke-dashoffset:0}}
</style>
