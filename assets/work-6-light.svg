<text class="serif" x="27" y="84" font-size="26" letter-spacing="-.4" fill="#1F2328">COAST</text>
<text class="sans" font-size="13" fill="#59636E"><tspan x="28" y="112">Keeps a vehicle’s position moving when GNSS dies,</tspan><tspan x="28" y="131">with a 392 KB on-device inertial-odometry model.</tspan></text>
