name: Refresh metrics

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**"]

permissions:
  contents: write

concurrency:
  group: refresh-metrics
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate panels
        run: node scripts/generate.mjs
        env:
          GH_USER: ${{ github.repository_owner }}
          # Optional: add a METRICS_TOKEN secret (classic PAT, no scopes) for
          # accurate contribution counts. Falls back to the default token.
          GH_TOKEN: ${{ secrets.METRICS_TOKEN || github.token }}
          TAGLINE: "Building careful systems and measuring what they do."
          EXCLUDE_LANGS: "HTML,CSS,Jupyter Notebook"

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "chore: refresh metrics" && git push)
